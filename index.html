<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Super Serika Kart</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1f8ff0" />
    <meta name="description" content="Super Serika Kart - a kart racer starring Serika and the students of Kivotos. Race CPUs, time trials or friends online." />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Serika Kart" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/base.css" />
  </head>
  <body>
    <!-- 3D canvas goes here -->
    <div id="app"></div>
    <!-- In-race HUD layer (owned by src/ui/HUD.js) -->
    <div id="hud"></div>
    <!-- Menus / title / results layer (owned by src/ui/Menus.js) -->
    <div id="menu"></div>
    <!-- Fades, loading screen, toasts -->
    <div id="overlay"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
